[project]
name = "lakehouse-to-pg"
version = "0.1.0"
description = "Local dbt + DuckDB lakehouse with a config-driven gold -> PostgreSQL sync"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.10.5",
    "dbt-duckdb>=1.9",
    "duckdb",
    "pika>=1.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
]

[project.scripts]
gold2psql = "gold2psql.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gold2psql/src/gold2psql"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["gold2psql/tests"]
markers = ["integration: needs the local Postgres from docker-compose.yml"]
