services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gold2psql
      POSTGRES_PASSWORD: gold2psql
      POSTGRES_DB: serving
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold2psql -d serving"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
